services:
  - type: web
    name: football-ai-api
    runtime: python
    plan: free
    branch: feature/site-polish
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.deploy:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FOOTBALL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
