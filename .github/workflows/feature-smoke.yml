name: Advanced Stats Feature Smoke

on:
  push:
    branches:
      - feature/advanced-match-stats
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Verify complete empty-average schema
        run: |
          export PYTHONPATH="$PWD/backend"
          python - <<'PY'
          from app.services.team_data import calcola_medie_partite

          expected = {
              "gol_fatti",
              "gol_subiti",
              "corner",
              "ammonizioni",
              "possesso",
              "tiri_in_porta",
              "tiri_fuori",
              "attacchi",
              "attacchi_pericolosi",
          }
          result = calcola_medie_partite([])
          assert set(result) == expected, result
          assert all(value == 0 for value in result.values()), result
          print("team_data empty schema: PASS")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
