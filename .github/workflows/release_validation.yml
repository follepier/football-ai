name: Release Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/multi-league-engine
      - feature/upcoming-fixtures-ui
      - feature/site-polish
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'render.yaml'
      - '.github/workflows/release_validation.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'render.yaml'
      - '.github/workflows/release_validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall backend/app backend/*.py

      - name: Verify v0.7.0 multi-league release configuration
        working-directory: backend
        run: python verify_multileague_release.py

      - name: Verify upcoming fixtures logic
        working-directory: backend
        run: |
          if [ -f verify_upcoming_fixtures_logic.py ]; then
            python verify_upcoming_fixtures_logic.py
          else
            echo "Upcoming fixtures verifier not present; skipping."
          fi

      - name: Verify advanced metrics logic
        working-directory: backend
        run: |
          if [ -f verify_advanced_metrics_logic.py ]; then
            python verify_advanced_metrics_logic.py
          else
            echo "Advanced metrics verifier not present; skipping."
          fi

      - name: Verify provider rate-limit resilience
        working-directory: backend
        run: python verify_provider_resilience.py

      - name: Verify Understat fallback logic
        working-directory: backend
        run: python verify_understat_fallback_logic.py

      - name: Verify persistent analysis cache
        working-directory: backend
        run: python verify_analysis_cache.py

      - name: Import FastAPI app
        working-directory: backend
        run: python -c "from app.main import app; assert app.version == '0.7.0'; print('PASS FastAPI app import')"

      - name: Import production FastAPI entrypoint
        working-directory: backend
        run: python -c "from app.deploy import app; assert app.version == '0.7.0'; print('PASS production entrypoint import')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Cloudflare Pages API proxy
        working-directory: frontend
        run: node --check 'functions/api/[[path]].js'

      - name: Build frontend
        working-directory: frontend
        run: npm run build
